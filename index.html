<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5f0"><meta name="description" content="PARAREAD — 초병렬 독서 아카이브"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>PARAREAD · 초병렬 독서</title><link rel="stylesheet" href="./style.css"></head>
<body><div id="app"><header class="top"><div><div class="brand">PARA<span>READ</span><span class="brand-dot">●</span></div><small>READ IN PARALLEL.</small></div><button id="export" class="ghost" title="백업 내보내기">↗ 백업</button></header><main id="view"></main><nav id="nav" aria-label="주 메뉴"><button data-tab="home" class="active">⌂<span>홈</span></button><button data-tab="library">▤<span>서재</span></button><button data-tab="stats">▥<span>통계</span></button><button data-tab="atlas">✧<span>탐험</span></button></nav></div><dialog id="dialog"><form id="bookForm" method="dialog"><h2 id="formTitle">책 추가</h2><label>책 제목<input name="title" required maxlength="120" placeholder="책 제목"></label><label>저자<input name="author" maxlength="100" placeholder="저자"></label><label>전체 쪽수<input name="total" type="number" min="1" max="100000" required placeholder="320"></label><label>현재 쪽수<input name="page" type="number" min="0" max="100000" value="0" required></label><label>분야<select name="genre"><option>문학</option><option>역사</option><option>철학</option><option>사회</option><option>과학</option><option>예술</option><option>기타</option></select></label><div class="actions"><button type="button" id="cancel" class="secondary">취소</button><button type="submit" class="primary">저장</button></div></form></dialog><script src="./app.js" defer></script></body></html>
